<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat Index</title>
<meta name="robots" content="noindex">
<style>body { margin: 0; padding: 32px 16px; background: #1a1c20; color: #d9dbd6; font: 16px/1.5 'IBM Plex Sans', system-ui, sans-serif; } a { color: inherit; }</style>
<script>
// Game pages moved to games/<slug>/. This sends old links there, keeping the platform and cheat:
// game.html?g=gta-sa&p=xbox&c=jetpack and game.html#gta-sa/xbox both still work.
(function () {
  var h = location.hash.slice(1).split('/');
  var q = new URLSearchParams(location.search);
  var slug = h[0] || q.get('g') || '';
  if (!/^[a-z0-9-]+$/.test(slug)) { location.replace('./'); return; }
  var out = new URLSearchParams();
  var plat = h[1] || q.get('p');
  if (plat) out.set('p', plat);
  if (q.get('c')) out.set('c', q.get('c'));
  var rest = out.toString();
  location.replace('games/' + slug + '/' + (rest ? '?' + rest : ''));
})();
</script>
</head>
<body>
<p>Game pages have moved. <a href="./">See all games</a>.</p>
</body>
</html>
